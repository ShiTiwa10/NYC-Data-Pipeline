name: 'nyc_context_engine'
version: '1.0.0'
config-version: 2

profile: 'nyc_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_context_engine:
    #  Silver Layer: Cleaned, casted, and tested data
    silver:
      +materialized: view
      +schema: silver
    #  Gold Layer: Final analytical models (Star Schema)
    gold:
      +materialized: table
      +schema: gold